<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="t">USPS Notice 67 letter automation zones</title>
  <desc id="d">Schematic of a letter-size mailpiece showing the four Notice 67 zones: return address (upper left), FIM (upper right), OCR delivery-address read area (lower center), and the barcode clear zone (lower right). Zone positions are illustrative; confirm exact dimensions against USPS DMM 202 and Publication 25.</desc>

  <defs>
    
      
    
  </defs>

  

  
  <text x="40" y="34" fill="rgb(11, 42, 74)" font-size="24px" font-weight="700">USPS Notice 67 — Letter Automation Zones</text>
  <text x="40" y="52" fill="rgb(100, 116, 139)" font-size="13px">Where each element must sit on a letter-size mailpiece for USPS machine sorting</text>

  
  <rect x="40" y="72" width="740" height="316" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  
  <rect x="66" y="98" width="186" height="66" rx="4" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-width="1.5"/>
  <text x="74" y="118" fill="#115e59" font-size="13px" font-weight="700">RETURN ADDRESS</text>
  <text x="74" y="134" fill="#115e59" font-size="11px">Upper-left · sender info</text>
  <rect x="74" y="142" width="120" height="5" rx="2" fill="#0f766e" fill-opacity="0.35"/>
  <rect x="74" y="151" width="150" height="5" rx="2" fill="#0f766e" fill-opacity="0.35"/>

  
  <rect x="700" y="96" width="54" height="40" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="727" y="120" text-anchor="middle" fill="#64748b" font-size="11px">POSTAGE</text>

  
  <rect x="612" y="96" width="78" height="66" rx="4" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="1.5"/>
  <g fill="#7c3aed">
    <rect x="624" y="106" width="5" height="30"/>
    <rect x="635" y="106" width="5" height="30"/>
    <rect x="651" y="106" width="5" height="30"/>
    <rect x="667" y="106" width="5" height="30"/>
    <rect x="678" y="106" width="5" height="30"/>
  </g>
  <text x="651" y="150" text-anchor="middle" fill="#5b21b6" font-size="13px" font-weight="700">FIM</text>

  
  <rect x="210" y="226" width="360" height="92" rx="4" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
  <text x="222" y="248" fill="#1e3a8a" font-size="13px" font-weight="700">OCR READ AREA</text>
  <text x="222" y="264" fill="#1e3a8a" font-size="11px">Delivery address must sit entirely inside here</text>
  <rect x="222" y="276" width="150" height="6" rx="3" fill="#2563eb" fill-opacity="0.40"/>
  <rect x="222" y="288" width="200" height="6" rx="3" fill="#2563eb" fill-opacity="0.40"/>
  <rect x="222" y="300" width="120" height="6" rx="3" fill="#2563eb" fill-opacity="0.40"/>

  
  <rect x="470" y="330" width="288" height="40" rx="4" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
  <g fill="#b45309" fill-opacity="0.55">
    <rect x="486" y="340" width="3" height="20"/><rect x="492" y="340" width="3" height="20"/>
    <rect x="500" y="340" width="3" height="20"/><rect x="508" y="340" width="3" height="20"/>
    <rect x="514" y="340" width="3" height="20"/><rect x="522" y="340" width="3" height="20"/>
    <rect x="530" y="340" width="3" height="20"/><rect x="538" y="340" width="3" height="20"/>
    <rect x="546" y="340" width="3" height="20"/><rect x="554" y="340" width="3" height="20"/>
  </g>
  <text x="572" y="347" fill="#92400e" font-size="13px" font-weight="700">BARCODE (IMb) CLEAR ZONE</text>
  <text x="572" y="362" fill="#92400e" font-size="11px">Keep free of all printing &amp; dark color</text>

  
  <text x="40" y="416" fill="rgb(11, 42, 74)" font-size="12.5px" font-weight="700">Letter size: <tspan font-weight="400" fill="rgb(51, 65, 85)" font-size="12.5px">3.5–6.125" high × 5–11.5" long · aspect ratio 1.3–2.5 · source: USPS DMM 101.1.2</tspan></text>

  
  <text x="40" y="438" fill="rgb(148, 163, 184)" font-size="11px">Schematic — zone positions are illustrative. Confirm exact placement against USPS DMM 202 &amp; Publication 25 before press.</text>

  
  <text x="780" y="438" text-anchor="end" fill="rgb(11, 42, 74)" font-size="12px" font-weight="700">Cornerstone Services</text>
</svg>